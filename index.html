<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover useful places around you with Ashepashe.">
    <title>Ashe Pashe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="/" aria-label="Ashepashe home">Ashepashe</a>
        <p>Discover what's around you.</p>
    </header>

    <main>
        <section aria-labelledby="welcome-heading">
            <h1 id="welcome-heading">Find nearby places</h1>
            <p>Explore useful places around your current location.</p>

            <div class="location-action-row">
                <button id="use-location-button" type="button">Use My Location</button>
                <span id="current-location" aria-live="polite">Location not selected</span>
            </div>

            <form id="place-search-form" role="search">
                <label for="place-search">Search nearby places</label>
                <input id="place-search" name="place" type="search" placeholder="Try pizza, coffee, or pharmacy">
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="search-radius" aria-labelledby="radius-heading">
            <h2 id="radius-heading">Search distance</h2>
            <div class="radius-options" role="group" aria-label="Search distance">
                <button type="button" data-radius="1" aria-pressed="false">1 km</button>
                <button type="button" data-radius="3" aria-pressed="true">3 km</button>
                <button type="button" data-radius="5" aria-pressed="false">5 km</button>
                <button type="button" data-radius="10" aria-pressed="false">10 km</button>
            </div>
        </section>

        <nav aria-label="Place categories">
            <h2>Categories</h2>
            <ul>
                <li><button type="button" data-category="restaurant" aria-pressed="false">Restaurants</button></li>
                <li><button type="button" data-category="cafe" aria-pressed="false">Cafes</button></li>
                <li><button type="button" data-category="hospital" aria-pressed="false">Hospitals</button></li>
                <li><button type="button" data-category="pharmacy" aria-pressed="false">Pharmacies</button></li>
                <li><button type="button" data-category="hotel" aria-pressed="false">Hotels</button></li>
                <li><button type="button" data-category="schoolCollege" aria-pressed="false">Schools &amp; Colleges</button></li>
                <li><button type="button" data-category="university" aria-pressed="false">Universities</button></li>
                <li><button type="button" data-category="atm" aria-pressed="false">ATMs</button></li>
                <li><button type="button" data-category="supermarket" aria-pressed="false">Supermarkets</button></li>
            </ul>
        </nav>

        <section aria-labelledby="results-heading">
            <h2 id="results-heading">Nearby places</h2>
            <p id="status-message">Allow location access to discover nearby places.</p>
            <div id="places-list" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ashepashe</p>
        <p>Place names powered by <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>.</p>
    </footer>
    <script type="module" src="index.js"></script>
</body>
</html>
